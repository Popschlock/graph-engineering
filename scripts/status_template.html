<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ge: __GE_TITLE__</title>
<!--
  Graph Engineering status page. Self-contained: no network, system fonts, drawn from the JSON in #ge-data
  and kept live by polling status.js through a plain script element, the one load a file:// page is allowed.
  Design notes: the hero is what the runner is doing NOW; the state palette is the only colour; sections
  are divided by rules, not floated as cards; monospace is for ids, hashes and commands only.
-->
<style>
:root {
  --bg: #12171d; --bg2: #171d24; --surface: #1c242d; --line: #2a343f; --line2: #354150;
  --text: #e8ebef; --muted: #98a3b0; --faint: #6b7784; --accent: #dfe5ec;
  --open: #9aa0a6; --ready: #3b82f6; --prog: #f59e0b; --done: #22c55e; --blocked: #ef4444; --skipped: #6b7280;
  --shadow: 0 1px 0 rgba(0,0,0,.35);
  --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html[data-theme="light"] {
  --bg: #f4f6f8; --bg2: #eef1f4; --surface: #ffffff; --line: #dde3ea; --line2: #c9d2dc;
  --text: #1a2129; --muted: #5b6673; --faint: #8b96a3; --accent: #1f2a36;
  --open: #8b939b; --skipped: #9aa3ad; --shadow: 0 1px 0 rgba(20,30,40,.06);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
body { min-height: 100vh; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 2px solid var(--ready); outline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: .92em; }
.wrap { max-width: 1480px; margin: 0 auto; padding: 0 28px; }
@media (max-width: 720px) { .wrap { padding: 0 16px; } }

/* top bar */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 18px; height: 52px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand .name { font-family: var(--display); font-weight: 650; font-size: 17px; letter-spacing: -.01em; }
.brand .subject { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .spacer { flex: 1; }
.live { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--done); box-shadow: 0 0 0 0 color-mix(in srgb, var(--done) 60%, transparent); }
.live.stale .dot { background: var(--prog); }
.live.static .dot { background: var(--faint); }
.live .dot.beat { animation: beat 1.2s ease-out 1; }
@keyframes beat { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--done) 60%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }
.iconbtn { width: 34px; height: 34px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--muted); border: 1px solid transparent; }
.iconbtn:hover { border-color: var(--line2); color: var(--text); }
.iconbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* hold banner */
.hold { display: none; padding: 10px 0; font-weight: 600; }
.hold.on { display: block; }
.hold .wrap { display: flex; gap: 12px; align-items: center; }
.hold.paused { background: color-mix(in srgb, var(--prog) 16%, var(--bg)); color: var(--prog); border-bottom: 1px solid color-mix(in srgb, var(--prog) 40%, transparent); }
.hold.stopped { background: color-mix(in srgb, var(--blocked) 16%, var(--bg)); color: var(--blocked); border-bottom: 1px solid color-mix(in srgb, var(--blocked) 40%, transparent); }
.hold .note { color: var(--text); font-weight: 400; }

/* now: the hero */
.now { padding: 28px 0 24px; border-bottom: 1px solid var(--line); }
.now .wrap { display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: start; }
@media (max-width: 860px) { .now .wrap { grid-template-columns: 1fr; } }
.now .kicker { color: var(--muted); font-size: 13px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
.now .kicker .state { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; color: var(--text); }
.now .kicker .state::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--faint)); }
.now h1 { font-family: var(--display); font-size: clamp(22px, 2.6vw, 34px); line-height: 1.15; letter-spacing: -.015em; font-weight: 600; margin: 0; max-width: 36ch; text-wrap: balance; }
.now h1.long { font-size: clamp(18px, 1.8vw, 24px); max-width: 60ch; text-wrap: pretty; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.now h1 .id { font-family: var(--mono); font-weight: 600; font-size: .78em; color: var(--prog); margin-right: .45em; letter-spacing: 0; }
.now h1 .id.idle { color: var(--ready); }
.now h1 .id.blocked { color: var(--blocked); }
.now .facts { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--muted); font-size: 14px; }
.now .facts b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.now .facts .gate { display: inline-flex; align-items: center; gap: 7px; }
.now .facts .gate .spin { width: 10px; height: 10px; border: 2px solid var(--prog); border-right-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.now .ring { display: grid; grid-template-columns: auto auto; gap: 0 18px; align-items: center; }
.ring svg { width: 92px; height: 92px; }
.ring .num { font-family: var(--display); font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.ring .num small { font-size: 15px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.ring .of { color: var(--muted); font-size: 13px; margin-top: 4px; }
.counts { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 13px; color: var(--muted); grid-column: 1 / -1; }
.counts span { display: inline-flex; align-items: center; gap: 6px; padding: 2px 0; }
.counts span::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.counts b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
.counts button.on { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }

/* sections */
section.block { border-bottom: 1px solid var(--line); padding: 22px 0 26px; }
.sech { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.sech h2 { font-family: var(--display); font-size: 16px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
.sech .hint { color: var(--muted); font-size: 13px; }
.sech .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { border: 1px solid var(--line2); border-radius: 999px; padding: 3px 11px; font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.chip:hover { color: var(--text); }
.chip.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.chip .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
input.search { background: var(--surface); border: 1px solid var(--line2); color: var(--text); border-radius: 8px; padding: 5px 10px; font-size: 13px; width: 200px; }

/* graph */
.graph { position: relative; background: var(--bg2);
  background-image: radial-gradient(color-mix(in srgb, var(--line2) 80%, transparent) 1px, transparent 1px); background-size: 18px 18px;
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; height: 560px; min-height: 240px; max-height: 90vh; resize: vertical;
  cursor: grab; touch-action: none; user-select: none; }
.graph.panning { cursor: grabbing; }
.graph svg { display: block; width: 100%; height: 100%; }
.graph text { font-family: var(--sans); }
.graph .hud { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; align-items: center; background: color-mix(in srgb, var(--surface) 88%, transparent);
  border: 1px solid var(--line2); border-radius: 8px; padding: 3px; font-size: 12px; color: var(--muted); backdrop-filter: blur(6px); }
.graph .hud button { width: 26px; height: 24px; border-radius: 5px; display: grid; place-items: center; color: var(--muted); }
.graph .hud button:hover { background: var(--bg2); color: var(--text); }
.graph .hud .k { min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
.graph .help { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--faint); pointer-events: none; }
.gnode { cursor: pointer; }
.gnode rect.body { fill: color-mix(in srgb, var(--c) 14%, var(--surface)); stroke: var(--c); stroke-width: 1.2; }
.gnode.done rect.body { fill: color-mix(in srgb, var(--c) 22%, var(--surface)); }
.gnode.skipped rect.body { fill: url(#hatch); stroke: var(--skipped); }
.gnode.selected rect.body { stroke-width: 2.5; }
.gnode:hover rect.body { stroke-width: 2; }
.gnode rect.bar { fill: var(--c); }
.gnode .id { font-family: var(--mono); font-weight: 600; font-size: 11.5px; fill: var(--text); }
.gnode .sub { font-size: 11px; fill: var(--muted); }
.gnode.prog rect.body { animation: pulse 2.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { stroke-width: 1.2; } 50% { stroke-width: 3; } }
.gnode.flash rect.body { animation: flash 1.4s ease-out 1; }
@keyframes flash { 0% { fill: color-mix(in srgb, var(--c) 70%, var(--surface)); } 100% { fill: color-mix(in srgb, var(--c) 14%, var(--surface)); } }
.edge { fill: none; stroke: var(--line2); stroke-width: 1.2; }
.edge.hot { stroke: var(--prog); stroke-width: 1.6; }
.edge.next { stroke: var(--ready); }
.band { fill: color-mix(in srgb, var(--surface) 55%, transparent); stroke: var(--line); }
.band-lab { font-family: var(--display); font-weight: 600; font-size: 12px; fill: var(--muted); }
.band-title { font-size: 11.5px; fill: var(--faint); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 12.5px; margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend span::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.legend span.skipped::before { background: repeating-linear-gradient(45deg, var(--skipped) 0 2px, transparent 2px 5px); }

/* tasks */
.phase { margin-top: 18px; }
.phase:first-child { margin-top: 0; }
.phase-h { display: flex; align-items: baseline; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.phase-h .pid { font-family: var(--display); font-weight: 650; font-size: 14px; }
.phase-h .pt { color: var(--muted); font-size: 13px; }
.phase-h .pc { margin-left: auto; color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.row { border-bottom: 1px solid var(--line); scroll-margin-top: 64px; }
.row-h { display: grid; grid-template-columns: 18px 76px 1fr auto 20px; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 9px 4px; border-radius: 6px; }
.row-h:hover { background: var(--bg2); }
.row.expanded .row-h { background: var(--bg2); }
.row-h .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); justify-self: center; }
.row-h .dot.skipped { background: repeating-linear-gradient(45deg, var(--skipped) 0 2px, transparent 2px 4px); }
.row-h .dot.prog { box-shadow: 0 0 0 3px color-mix(in srgb, var(--prog) 30%, transparent); }
.row-h .rid { font-family: var(--mono); font-weight: 600; font-size: 12.5px; }
.row-h .rsub { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.expanded .row-h .rsub { white-space: normal; }
.row-h .rmeta { color: var(--muted); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row-h .rmeta .st { color: var(--c); font-weight: 600; }
.row-h .chev { width: 16px; height: 16px; color: var(--faint); transition: transform .18s; }
.row.expanded .chev { transform: rotate(180deg); }
.row.flash .row-h { animation: rowflash 1.4s ease-out 1; }
@keyframes rowflash { 0% { background: color-mix(in srgb, var(--c) 30%, transparent); } 100% { background: var(--bg2); } }
@media (max-width: 720px) { .row-h { grid-template-columns: 14px 60px 1fr 20px; } .row-h .rmeta { display: none; } }
.detail { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.4fr); gap: 20px 32px; padding: 10px 4px 20px 34px; }
@media (max-width: 900px) { .detail { grid-template-columns: 1fr; padding-left: 4px; } }
.detail h4 { margin: 0 0 6px; font-size: 12.5px; color: var(--faint); font-weight: 600; }
.detail .grp { margin-bottom: 16px; }
.detail dl { margin: 0; display: grid; grid-template-columns: 96px 1fr; gap: 5px 12px; font-size: 13.5px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.detail dd.mono { font-family: var(--mono); font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px 1px 6px; border-radius: 999px; border: 1px solid var(--line2); font-size: 12.5px; margin: 0 6px 4px 0; background: var(--surface); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.pill.link { cursor: pointer; }
.pill.link:hover { border-color: var(--text); }
.tokens { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.tok { background: color-mix(in srgb, var(--done) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--done) 40%, transparent); border-radius: 8px; padding: 6px 10px; min-width: 84px; }
.tok .v { font-family: var(--display); font-size: 20px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tok .k { font-size: 12px; color: var(--muted); margin-top: 2px; }
.prose { font-size: 14px; line-height: 1.5; max-width: 70ch; }
.reason { color: var(--blocked); font-weight: 600; }
pre.kick { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 12.5px; line-height: 1.5;
  white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow: auto; margin: 0; }
.timeline { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.timeline li { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.timeline .t { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12px; }
.timeline .ok { color: var(--done); font-weight: 600; }
.timeline .no { color: var(--blocked); font-weight: 600; }
.timeline .run { color: var(--prog); font-weight: 600; }
.gatecmd { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.hist { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.hist td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.hist td.t { white-space: nowrap; color: var(--faint); font-variant-numeric: tabular-nums; }
.hist td.e { font-weight: 600; white-space: nowrap; }
.empty { color: var(--faint); font-size: 13px; padding: 10px 4px; }

/* activity + ledger + calls */
.twocol { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 28px; }
@media (max-width: 960px) { .twocol { grid-template-columns: 1fr; } }
.tabs { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
.tabs button { padding: 4px 12px; font-size: 13px; color: var(--muted); }
.tabs button.on { background: var(--accent); color: var(--bg); }
.feed { list-style: none; margin: 0; padding: 0; max-height: 440px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.feed li { display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.feed li:last-child { border-bottom: 0; }
.feed .t { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
.feed .who { font-family: var(--mono); font-size: 12px; }
.feed .ev { font-weight: 600; }
.feed .ev.done, .feed .ev.MATCH, .feed .ev.resumed { color: var(--done); }
.feed .ev.started, .feed .ev.running, .feed .ev.paused { color: var(--prog); }
.feed .ev.blocked, .feed .ev.miss, .feed .ev.NOMATCH { color: var(--blocked); }
.feed .ev.review, .feed .ev.revised { color: var(--ready); }
.feed .out { color: var(--muted); overflow-wrap: anywhere; }
.feed .task { font-family: var(--mono); font-weight: 600; cursor: pointer; }
.feed .task:hover { text-decoration: underline; }
.calls ul { list-style: none; margin: 0; padding: 0; }
.calls li { padding: 10px 12px; border-left: 3px solid var(--blocked); background: color-mix(in srgb, var(--blocked) 8%, var(--surface)); border-radius: 0 8px 8px 0; margin-bottom: 8px; font-size: 13.5px; overflow-wrap: anywhere; }
.calls details { margin-top: 12px; }
.calls summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.calls details li { border-left-color: var(--line2); background: var(--surface); color: var(--muted); }
.goal { color: var(--muted); font-size: 13.5px; line-height: 1.5; max-width: 80ch; white-space: pre-wrap; }
details.goalbox summary { cursor: pointer; font-family: var(--display); font-weight: 650; font-size: 16px; }
footer { padding: 18px 0 40px; color: var(--faint); font-size: 12.5px; display: flex; gap: 18px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { .gnode.prog rect.body, .live .dot.beat, .now .facts .gate .spin, .gnode.flash rect.body, .row.flash .row-h { animation: none !important; } .chev { transition: none; } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><span class="name" id="b-name"></span><span class="subject" id="b-subject"></span></div>
  <div class="spacer"></div>
  <div class="live" id="live"><span class="dot"></span><span id="live-text">live</span></div>
  <button class="iconbtn" id="theme" title="Switch theme" aria-label="Switch theme">
    <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-1-.1-1.4A5.5 5.5 0 0 1 13.4 3.1C13 3 12.5 3 12 3z"/></svg>
  </button>
</div></header>
<div class="hold" id="hold"><div class="wrap"><span id="hold-text"></span><span class="note" id="hold-note"></span></div></div>
<main>
  <section class="now"><div class="wrap" id="now"></div></section>
  <section class="block"><div class="wrap">
    <div class="sech"><h2>Graph</h2><span class="hint">columns by dependency depth, bands by phase; click a node to open it</span>
      <div class="tools"><button class="chip" id="fit">Fit all</button><button class="chip" id="locate">Go to current</button></div></div>
    <div class="graph" id="graph"></div>
    <div class="legend" id="legend"></div>
  </div></section>
  <section class="block"><div class="wrap">
    <div class="sech"><h2>Tasks</h2><span class="hint" id="task-hint"></span>
      <div class="tools" id="filters"></div></div>
    <div id="tasks"></div>
  </div></section>
  <section class="block"><div class="wrap twocol">
    <div>
      <div class="sech"><h2 id="feed-title">Activity</h2>
        <div class="tools"><div class="tabs"><button data-tab="activity" class="on">Activity</button><button data-tab="ledger">Ledger</button></div>
          <input class="search" id="feed-q" placeholder="Filter by task or text"></div></div>
      <ul class="feed" id="feed"></ul>
    </div>
    <div class="calls">
      <div class="sech"><h2>Calls for you</h2><span class="hint" id="calls-hint"></span></div>
      <div id="calls"></div>
    </div>
  </div></section>
  <section class="block"><div class="wrap">
    <details class="goalbox"><summary>Goal</summary><p class="goal" id="goal"></p></details>
  </div></section>
  <footer class="wrap" id="foot"></footer>
</main>

<script id="ge-data" type="application/json">/*__GE_DATA__*/</script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var h = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var store = { get: function (k, d) { try { var v = localStorage.getItem("ge:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set: function (k, v) { try { localStorage.setItem("ge:" + k, JSON.stringify(v)); } catch (e) {} } };
  var KIND = { open: "open", ready: "ready", "in progress": "prog", done: "done", blocked: "blocked", skipped: "skipped" };
  var LABEL = { open: "open", ready: "ready", prog: "in progress", done: "done", blocked: "blocked", skipped: "skipped" };
  var ORDER = ["prog", "blocked", "ready", "open", "done", "skipped"];

  var data = null, prev = null, expanded = new Set(store.get("expanded", [])), filter = store.get("filter", "all"),
      query = "", tab = "activity", feedq = "", selected = null, lastLoad = 0, fails = 0, ticker = null, view = null, graphPos = {}, graphSize = [0, 0], dragged = false;

  // ---- header + hero ----

    html += '<h1 class="' + (headLen > 90 ? "long" : "") + '" title="' + h(headTitle) + '">' + head + "</h1><div class=\"facts\">" + facts.map(function (f) { return "<span>" + f + "</span>"; }).join("") + "</div></div>";

  // ---- graph ----

  // ---- graph viewport: drag pans, wheel zooms about the cursor, double-click fits (blueprint-editor habits) ----
  function applyView() {

  // ---- tasks ----
  function rowMeta(n) {
    var st = stateOf(n), m = [];
    if (n.kind === "in progress") { var s = since(n.started); m.push('<span class="st">running' + (s != null ? " " + mins(s) : "") + "</span>"); }
    else if (n.kind === "done") { if (n.minutes != null) m.push(mins(n.minutes)); if (n.commit) m.push('<span class="mono">' + h(short(n.commit)) + "</span>"); m.push('<span class="st">done</span>'); }

    else if (n.ready) m.push('<span class="st">ready</span>');
    else if (n.kind === "skipped") m.push("skipped");
    else m.push("waits on " + n.deps.filter(function (d) { var x = byId(d); return x && x.kind !== "done"; }).map(h).join(", "));

  }
  function pills(ids) { return ids.length ? ids.map(function (d) { var x = byId(d); var st = x ? stateOf(x) : "open"; return '<span class="pill link" data-go="' + h(d) + '" style="--c:var(--' + st + ')">' + h(d) + "</span>"; }).join("") : '<span class="empty" style="padding:0">none</span>'; }
  function detail(n) {

    if (n.finished) L += "<dt>" + (n.kind === "blocked" ? "Blocked" : "Finished") + "</dt><dd>" + h(n.finished) + (n.minutes != null ? " (" + mins(n.minutes) + ")" : "") + "</dd>";
    if (n.commit) L += '<dt>Commit</dt><dd class="mono">' + h(n.commit) + "</dd>";
    L += "<dt>Phase</dt><dd>" + h(n.phase || "other") + "</dd>";

    L += "<dt>Spec</dt><dd>" + h(n.spec || "—") + "</dd>";
    L += "<dt>Gates</dt><dd>" + (n.gates.length ? n.gates.map(function (g) { var x = gates[g]; return "<div><b>" + h(g) + "</b>" + (x ? ' <span class="gatecmd">' + h(x.command) + (x.floor ? " (floor " + h(x.floor) + ")" : "") + "</span>" : "") + "</div>"; }).join("") : "none") + "</dd>";
    L += "</dl></div></div>";
    var R = "<div>";
    if (n.kind === "in progress") {

      R += '<div class="grp"><h4>Gate activity this window</h4>' + (act.length ? '<ul class="timeline">' + act.slice(-12).map(function (a) {
        return '<li><span class="t">' + h(a.ts.slice(11, 16)) + '</span><span><span class="' + (a.state === "running" ? "run" : a.state === "MATCH" ? "ok" : "no") + '">' + h(a.state === "MATCH" ? "passed" : a.state === "running" ? "running" : "failed") + "</span> " + h(a.name) + (a.detail ? ' <span style="color:var(--muted)">' + h(a.detail) + "</span>" : "") + "</span></li>"; }).join("") + "</ul>" : '<div class="empty">No gate has run yet in this window.</div>') + "</div>";
      if (n.kickoff) R += '<div class="grp"><h4>Kickoff brief</h4><pre class="kick">' + h(n.kickoff) + "</pre></div>";

  function visible(n) {

  // ---- feed + calls ----

    var items = [], q = feedq.toLowerCase();
    if (tab === "activity") {
      data.activity.slice().reverse().forEach(function (a) { items.push({ t: tsShort(a.ts), who: "", ev: a.state === "NO MATCH" ? "NOMATCH" : a.state, evText: a.state === "MATCH" ? "passed" : a.state === "running" ? "running" : a.state === "NO MATCH" ? "failed" : a.state, task: "", out: (a.kind === "gate" ? "gate " + a.name + (a.detail ? " " + a.detail : "") : a.text) }); });
      data.ledger.slice().reverse().forEach(function (r) { items.push({ t: tsShort(r.ts), who: r.session, ev: r.event.split(" ")[0], evText: r.event, task: r.task === "-" ? "" : r.task, out: r.outcome + (r.commit ? " " + short(r.commit) : "") }); });
      items.sort(function (a, b) { return a.t < b.t ? 1 : a.t > b.t ? -1 : 0; });
    } else {
      data.ledger.slice().reverse().forEach(function (r) { items.push({ t: r.ts, who: r.session, ev: r.event.split(" ")[0], evText: r.event, task: r.task === "-" ? "" : r.task, out: r.outcome + (r.commit ? " " + short(r.commit) : "") }); });
    }
    if (q) items = items.filter(function (i) { return (i.task + " " + i.evText + " " + i.out + " " + i.who).toLowerCase().indexOf(q) >= 0; });
    $("#feed").innerHTML = items.length ? items.slice(0, 200).map(function (i) {
      return '<li><span class="t">' + h(i.t) + '</span><span><span class="ev ' + h(i.ev) + '">' + h(i.evText) + "</span> " + (i.task ? '<span class="task" data-go="' + h(i.task) + '">' + h(i.task) + "</span> " : "") + '<span class="out">' + h(i.out) + "</span>" + (i.who ? ' <span class="who" style="color:var(--faint)">' + h(i.who) + "</span>" : "") + "</span></li>"; }).join("")
      : '<li><span class="t"></span><span class="empty">Nothing here yet.</span></li>';
    document.querySelectorAll(".tabs button").forEach(function (b) { b.className = b.dataset.tab === tab ? "on" : ""; });
    $("#feed-title").textContent = tab === "activity" ? "Activity" : "Ledger";
  }
  function renderCalls() {
    var o = data.calls.open, d = data.calls.decided;
    $("#calls-hint").textContent = o.length ? o.length + " waiting" : "nothing waiting";
    $("#calls").innerHTML = (o.length ? "<ul>" + o.map(function (c) { return "<li>" + h(c) + "</li>"; }).join("") + "</ul>" : '<div class="empty">No decision is waiting on you. Anything an agent cannot decide lands here.</div>') +
      (d.length ? "<details><summary>" + d.length + " decided</summary><ul>" + d.slice().reverse().map(function (c) { return "<li>" + h(c) + "</li>"; }).join("") + "</ul></details>" : "");
    $("#goal").textContent = data.goal || "";
    $("#foot").innerHTML = "<span>generated " + h(data.generated.replace("T", " ")) + "</span>" + (data.gates.length ? "<span>gates: " + data.gates.map(function (g) { return h(g.name); }).join(", ") + "</span>" : "") + "<span>review every " + h(data.review_every) + " closes</span><span>ge/" + h(data.name) + "/status.html</span>";
  }
  function renderAll() { renderTop(); renderNow(); renderGraph(); renderTasks(); renderFeed(); renderCalls(); }

  // ---- interaction ----
  function toggle(id, force) {
    if (force === true || (force == null && !expanded.has(id))) expanded.add(id); else expanded.delete(id);
    store.set("expanded", Array.from(expanded)); selected = id; renderTasks(); renderGraph();
  }
  function goTo(id) { toggle(id, true); var el = document.getElementById("row-" + id); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-toggle],[data-go],[data-filter],[data-tab],[data-zoom],.gnode,#fit,#locate,#theme");
    if (!t) return;
    if (t.classList.contains("gnode") && dragged) { dragged = false; return; }
    if (t.dataset.toggle) toggle(t.dataset.toggle);
    else if (t.dataset.go) { goTo(t.dataset.go); centerOn(t.dataset.go); }
    else if (t.dataset.filter) { filter = t.dataset.filter; store.set("filter", filter); renderTasks(); }
    else if (t.dataset.tab) { tab = t.dataset.tab; renderFeed(); }
    else if (t.classList.contains("gnode")) goTo(t.dataset.id);
    else if (t.dataset.zoom) { var g = $("#graph"); zoomAt(t.dataset.zoom === "1" ? 1.25 : 0.8, g.clientWidth / 2, g.clientHeight / 2); }
    else if (t.id === "fit") fitAll();
    else if (t.id === "locate") { var cur = data.nodes.filter(function (n) { return n.kind === "in progress"; })[0] || data.nodes.filter(function (n) { return n.ready; })[0]; if (cur) { centerOn(cur.id, Math.max(view.k, 1)); goTo(cur.id); } }
    else if (t.id === "theme") { var th = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = th; store.set("theme", th); }
  });
  document.addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("gnode")) { e.preventDefault(); goTo(e.target.dataset.id); } });
  document.addEventListener("input", function (e) {
    if (e.target.id === "q") { query = e.target.value.toLowerCase(); var pos = e.target.selectionStart; renderTasks(); var q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); }
    if (e.target.id === "feed-q") { feedq = e.target.value; renderFeed(); }
  });

  // ---- live: poll status.js by script tag (the one load a file:// page is allowed) ----
  function setLive() {
    var el = $("#live"), txt = $("#live-text");
    if (fails >= 5 && !lastLoad) { el.className = "live static"; txt.textContent = "static snapshot (status.js not found)"; return; }
    var age = lastLoad ? Date.now() - lastLoad : 0;
    el.className = "live" + (fails >= 3 ? " stale" : "");
    txt.textContent = fails >= 3 ? "not updating (" + fails + " failed polls)" : lastLoad ? "live, checked " + ago(age) : "live, connecting";
  }
  window.geUpdate = function (d) {
    lastLoad = Date.now(); fails = 0;
    if (!data || d.generated !== data.generated) {
      prev = {}; if (data) data.nodes.forEach(function (n) { prev[n.id] = stateOf(n); });
      data = d; renderAll(); var dot = $("#live .dot"); dot.classList.remove("beat"); void dot.offsetWidth; dot.classList.add("beat");
    }
    setLive();
  };
  function poll() {
    var s = document.createElement("script"); s.src = "status.js?t=" + Date.now(); s.async = true;
    var done = false; function fin(ok) { if (done) return; done = true; if (!ok) { fails++; setLive(); } s.remove(); }
    s.onload = function () { fin(true); }; s.onerror = function () { fin(false); };
    document.head.appendChild(s);
  }

  // ---- boot ----
  var theme = store.get("theme", "dark"); document.documentElement.dataset.theme = theme;
  try { data = JSON.parse($("#ge-data").textContent); } catch (e) { document.body.innerHTML = '<p style="padding:40px">This page carries no data. Run <code>ge.py render &lt;r&gt;</code> again.</p>'; throw e; }
  renderAll(); setLive();
  poll(); setInterval(poll, 2000);
  ticker = setInterval(function () { renderNow(); setLive(); if (data.nodes.some(function (n) { return n.kind === "in progress" && expanded.has(n.id); })) renderTasks(); }, 30000);
})();
</script>
</body>
